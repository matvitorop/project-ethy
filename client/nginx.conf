server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — всі маршрути повертають index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кешування статичних assets (JS, CSS, зображення)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Не кешувати index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
