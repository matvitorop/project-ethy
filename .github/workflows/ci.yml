name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master", "dev"]

jobs:

  # ═══════════════════════════════════════════════════════
  # TEST — запускається на всіх гілках
  # ═══════════════════════════════════════════════════════

  test-server-unit:
    name: Test — Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore & build solution
        run: dotnet build project-ethy.slnx --configuration Release

      - name: Run unit tests
        run: dotnet test tests/server.UnitTests/server.UnitTests.csproj --no-build --verbosity normal

  test-server-integration:
    name: Test — Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore & build solution
        run: dotnet build project-ethy.slnx --configuration Release

      - name: Run integration tests
        run: dotnet test tests/server.IntegrationTests/server.IntegrationTests.csproj --no-build --verbosity normal

  test-client:
    name: Test — Client Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: npm-${{ hashFiles('client/package-lock.json') }}
          restore-keys: npm-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run lint
        working-directory: client
        run: npm run lint

  # ═══════════════════════════════════════════════════════
  # DOCKER — збірка і push на Docker Hub
  # Лише master, лише після всіх тестів
  # ═══════════════════════════════════════════════════════

  docker-push:
    name: Docker — Build & Push
    runs-on: ubuntu-latest
    needs: [test-server-unit, test-server-integration, test-client]
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ethy-server:latest
            ${{ secrets.DOCKER_USERNAME }}/ethy-server:${{ github.sha }}

      - name: Build & push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ethy-client:latest
            ${{ secrets.DOCKER_USERNAME }}/ethy-client:${{ github.sha }}

  # ═══════════════════════════════════════════════════════
  # DEPLOY — тригер Railway після push образів
  # ═══════════════════════════════════════════════════════

  deploy-server:
    name: Deploy — Railway Server
    runs-on: ubuntu-latest
    needs: docker-push

    steps:
      - name: Trigger Railway server redeploy
        run: |
          curl -s -X POST "${{ secrets.RAILWAY_WEBHOOK_SERVER }}" \
            -H "Content-Type: application/json"
          echo "✓ Server deployment triggered"

  deploy-client:
    name: Deploy — Railway Client
    runs-on: ubuntu-latest
    needs: docker-push

    steps:
      - name: Trigger Railway client redeploy
        run: |
          curl -s -X POST "${{ secrets.RAILWAY_WEBHOOK_CLIENT }}" \
            -H "Content-Type: application/json"
          echo "✓ Client deployment triggered"